<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FanPassport — Sandbox</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/sandbox.css" />
  <script src="/vendor/ethers.js"></script>
  <script src="js/common.js"></script>
</head>
<body class="sandbox">
<div class="sb">
  <section class="sb-left">
    <nav class="sb-steps" aria-label="Demo steps">
      <div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="lbl">Demo script</span><span class="hdr-chip"><span class="dot"></span><span id="chain">…</span></span></div>
      <div id="steps"></div>
      <button type="button" class="secondary" id="resetBtn" style="margin-top:10px">Reset chain</button>
    </nav>
    <div class="sb-main">
      <div class="panel">
        <div class="tagline"><span class="stepno" id="stepNo">STEP 0</span><span class="actor" id="actor"></span></div>
        <h1 id="title"></h1>
        <p id="desc"></p>
        <div class="row"><button type="button" class="run" id="runBtn"></button><span class="small muted" id="runHint"></span></div>
      </div>
      <div id="verdict"></div>
      <div class="panel rows" id="rows" hidden></div>
      <div class="events">
        <div class="row" style="justify-content:space-between"><span class="eyebrow">On-chain events</span><span class="eyebrow">no personal data</span></div>
        <div id="events" class="small muted">—</div>
      </div>
    </div>
  </section>
  <aside class="sb-right" aria-label="Fan phone">
    <span class="eyebrow">Fan's iPhone · <span id="phoneLabel">wallet</span></span>
    <div class="device">
      <iframe id="phone" title="Fan phone app" src="phone.html?screen=empty"></iframe>
      <div class="island"></div>
    </div>
    <p class="small muted" style="max-width:380px;text-align:center;margin:0 16px">Live with a real phone: on the same Wi-Fi, open the <a href="outbox.html">fan inbox</a>, scan a claim QR with the phone, then show its door pass to <a href="door.html?id=1">Door 1</a> → “Scan with camera”.</p>
  </aside>
</div>
<script src="js/sandbox.js"></script>
</body>
</html>
